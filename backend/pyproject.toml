[project]
name = "llmplaybench"
version = "0.1.0"
description = "Self-Hosted LLM Inference API + Benchmark Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "transformers>=4.30.0",
    "psutil",
    "prometheus-client",
    "python-dotenv",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "redis",
    "python-multipart",
    "gunicorn",
    "python-jose[cryptography]",
    "bcrypt",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]