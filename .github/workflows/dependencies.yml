name: Dependency Updates

on:
  schedule:
    - cron: "0 0 * * 1" # Run weekly at midnight on Monday
  workflow_dispatch: # Allow manual triggering

jobs:
  update-backend-deps:
    name: Update Backend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Update dependencies
        working-directory: ./backend
        run: |
          pip-compile --upgrade requirements.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build(backend): update dependencies"
          title: "build(backend): update Python dependencies"
          branch: "auto-backend-deps-update"
          base: ${{ github.ref_name }}
          delete-branch: true
          body: |
            This PR updates the Python dependencies for the backend service.

            This is an automated PR created by the dependency update workflow.

            **Changes**:
            ```diff
            $(git diff --unified=0 backend/requirements.txt)
            ```

  update-frontend-deps:
    name: Update Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Update dependencies
        working-directory: ./frontend
        run: |
          npm update
          npm audit fix || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build(frontend): update dependencies"
          title: "build(frontend): update NPM dependencies"
          branch: "auto-frontend-deps-update"
          base: ${{ github.ref_name }}
          delete-branch: true
          body: |
            This PR updates the NPM dependencies for the frontend service.

            This is an automated PR created by the dependency update workflow.

            **Changes**:
            ```diff
            $(git diff --unified=0 frontend/package.json)
            ```
